name: Build PronCam

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source commit (empty selects current main)
        required: false
        type: string
      publish_release:
        description: Publish the checked APK in Releases
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: proncam-public-build
  cancel-in-progress: true

jobs:
  source:
    if: github.repository_id == '1461381914' && github.actor == 'SOTTRME' && github.triggering_actor == 'SOTTRME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: source
        name: Select source revision
        env:
          PRONCAM_SOURCE_TOKEN: ${{ secrets.PRONCAM_SOURCE_TOKEN }}
          PRONCAM_SOURCE_REF: ${{ inputs.source_commit }}
        run: bash ci/public-build.sh resolve
      - name: Remove temporary metadata
        if: always()
        run: bash ci/public-build.sh cleanup

  host:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        lane: [shaders, native-a, native-b, native-c, strip-trailers, codecs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Install test tools
        run: |
          sdkmanager --install 'ndk;27.2.12479018' 'platforms;android-36'
          sudo apt-get update -qq
          sudo apt-get install -y python3-numpy python3-venv libegl1 libgl1-mesa-dri libegl-dev libgles-dev libvulkan-dev nasm ninja-build zlib1g-dev
      - name: Fetch pinned source
        env:
          PRONCAM_SOURCE_TOKEN: ${{ secrets.PRONCAM_SOURCE_TOKEN }}
          PRONCAM_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: bash ci/public-build.sh checkout
      - name: Run checks
        env:
          PRONCAM_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          PRONCAM_CHECK_LANE: ${{ matrix.lane }}
        run: bash ci/public-build.sh host
      - name: Remove temporary source
        if: always()
        run: bash ci/public-build.sh cleanup

  build:
    needs: [source, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - name: Install build tools
        run: sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
          add-job-summary: never
          dependency-graph: disabled
          build-scan-publish: false
      - name: Fetch pinned source
        env:
          PRONCAM_SOURCE_TOKEN: ${{ secrets.PRONCAM_SOURCE_TOKEN }}
          PRONCAM_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: bash ci/public-build.sh checkout
      - name: Check, build and sign
        env:
          PRONCAM_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SCAMERA_VERSION_CODE: ${{ needs.source.outputs.version }}
          SCAMERA_SIGNING_KEYSTORE: ${{ secrets.SCAMERA_SIGNING_KEYSTORE }}
          SCAMERA_KEYSTORE_PASSWORD: ${{ secrets.SCAMERA_SIGNING_PASSWORD }}
          GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'
        run: bash ci/public-build.sh build
      - name: Check publication files
        run: bash ci/public-build.sh stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PronCam-${{ needs.source.outputs.version }}
          path: public-out/*
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0
      - name: Publish release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          SCAMERA_VERSION_CODE: ${{ needs.source.outputs.version }}
        run: bash ci/public-build.sh release
      - name: Remove temporary source and key
        if: always()
        run: bash ci/public-build.sh cleanup
